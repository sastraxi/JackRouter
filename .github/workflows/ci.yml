# PR-time smoke build. Confirms the driver + daemon
# compile cleanly for both arches on a stock runner.

name: ci

on:
  pull_request:
  push:
    branches: [master]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install JACK2
        run: |
          brew update
          brew install jack
          echo "JACK_PREFIX=$(brew --prefix)" >> "$GITHUB_ENV"

      - name: Select Xcode
        # Pin to a recent stable Xcode rather than whatever the runner image
        # ships by default — keeps SDK behavior reproducible.
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build driver (Release, universal)
        run: |
          xcodebuild \
            -project driver/JackBridgePlugIn.xcodeproj \
            -target JackBridgePlugIn \
            -configuration Release \
            ONLY_ACTIVE_ARCH=NO \
            "JACK_PREFIX=$JACK_PREFIX" \
            build

      - name: Build daemon (Release, universal)
        run: |
          xcodebuild \
            -project driver/JackBridgePlugIn.xcodeproj \
            -target JackBridged \
            -configuration Release \
            ONLY_ACTIVE_ARCH=NO \
            "JACK_PREFIX=$JACK_PREFIX" \
            build
